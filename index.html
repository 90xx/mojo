<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YaLi 资源库</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <link rel="stylesheet" href="dist/style.css">
</head>
<body class="text-stone-600 min-h-screen flex flex-col selection:bg-green-200 selection:text-green-900">

    <!-- 🛡️ 访问验证模态框 -->
    <div id="accessModal" class="access-modal">
        <div class="access-modal-content">
            <div style="text-align:center; margin-bottom:1.75rem;">
                <a id="btn-tutorial" href="#" target="_blank" rel="noopener noreferrer" class="tutorial-btn">
                    📖 取码教程
                </a>
            </div>
            <a id="accessLink" href="#" target="_blank" rel="noopener noreferrer" class="access-link-btn">
                <span style="margin-right:0.5rem;">👉</span> 点击获取 <span id="linkDate" style="margin-left:0.25rem;"></span> 访问码
            </a>
            <input id="accessCodeInput" type="text" placeholder="请输入访问码，不会的看上方教程" maxlength="15" autocomplete="off" class="access-input" />
            <button id="verifyBtn" class="verify-btn">✅ 验证并进入</button>
            <div id="errorText" class="error-text"></div>
        </div>
    </div>

    <!-- ✅ 顶栏 -->
    <header class="backdrop-blur-xl bg-[#F4F7F2]/90 border-b border-green-100/80 px-4 pt-3 pb-2 md:p-4 sticky top-0 z-50 flex flex-col gap-2.5 shadow-sm">
        <div class="flex items-center justify-between w-full">
            <div class="w-16 md:hidden"></div>
            <h1 id="site-title" class="text-lg md:text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-green-800 to-emerald-600 text-center flex-1 tracking-tight">资源库</h1>
            <div class="flex gap-2 shrink-0">
                <a id="btn-announcement" href="#" target="_blank"
                   class="px-3 py-1 rounded-full bg-green-50 border border-green-200 text-xs font-semibold text-green-800 hover:text-green-900 hover:bg-green-100 hover:border-green-300 transition-all whitespace-nowrap">
                    📢 新人必看
                </a>
                <a id="btn-novel" href="#" target="_blank"
                   class="px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-xs font-semibold text-emerald-800 hover:text-emerald-900 hover:bg-emerald-100 hover:border-emerald-300 transition-all whitespace-nowrap">
                    📖 泰剧小说
                </a>
                <a id="btn-message-board" href="#" target="_blank"
                   class="px-3 py-1 rounded-full bg-teal-50 border border-teal-200 text-xs font-semibold text-teal-800 hover:text-teal-900 hover:bg-teal-100 hover:border-teal-300 transition-all whitespace-nowrap">
                    💬 留言
                </a>
            </div>
        </div>

        <div class="w-full">
            <input type="text" id="search-input" placeholder="🔍 搜索资源名称..."
                   class="w-full bg-white border border-green-200 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-green-400/40 focus:border-green-500 text-sm text-stone-700 placeholder-stone-400 transition-all shadow-sm">
        </div>

        <div class="w-full">
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="parent-category-bar">
                <button id="btn-reset-category" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white text-stone-600 border border-green-200 hover:bg-green-50 transition category-active whitespace-nowrap">全部</button>
            </div>
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 hidden" id="child-category-bar"></div>
        </div>

        <div class="flex items-center justify-between w-full pt-0.5">
            <div class="flex bg-green-50 rounded-lg p-0.5 border border-green-100">
                <button id="sort-date" class="sort-btn px-3 py-1.5 rounded-md text-xs font-semibold bg-gradient-to-r from-green-700 to-emerald-600 text-white shadow-sm whitespace-nowrap transition">按时间</button>
                <button id="sort-pinyin" class="sort-btn sort-btn-inactive px-3 py-1.5 rounded-md text-xs whitespace-nowrap transition">按名称</button>
            </div>
            <span class="text-xs text-stone-500 font-semibold">共 <span id="total-count" class="text-green-800 font-bold">0</span> 条</span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <main class="flex-1 p-4 md:p-6 overflow-y-auto" id="main-content">
            <div id="card-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mb-8"></div>
            <div id="pagination" class="flex justify-center items-center gap-2 mt-8 mb-12"></div>
        </main>
    </div>

    <!-- 详情弹窗 -->
    <div id="modal" class="fixed inset-0 bg-stone-900/20 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-green-100 overflow-hidden transform transition-all">
            <div class="p-6 border-b border-green-100 flex justify-between items-start bg-gradient-to-r from-green-50 to-emerald-50">
                <h2 id="modal-title" class="text-xl font-bold text-stone-700 pr-4 tracking-tight"></h2>
                <button id="modal-close" class="text-stone-400 hover:text-stone-600 text-2xl leading-none transition">&times;</button>
            </div>
            <div class="p-6">
                <div id="modal-meta" class="flex flex-wrap gap-2 mb-4 text-xs"></div>
                <div id="modal-links" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="verify.js"></script>
</body>
</html>
